<header class="topbar">
  <div class="topbar__left">
    <button
      type="button"
      class="icon-btn topbar__menu-m"
      (click)="toggleMenu()"
      [attr.aria-label]="'topbar.openMenu' | t"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
    <div class="search-wrap">
      <svg
        class="search-wrap__icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="M21 21l-4.35-4.35" />
      </svg>
      <input
        type="search"
        class="search-wrap__input"
        [placeholder]="'topbar.searchPlaceholder' | t"
        autocomplete="off"
      />
    </div>
  </div>
  <div class="topbar__right">
    <label class="topbar__locale" [attr.title]="'topbar.language' | t">
      <span class="topbar__locale-label">{{ 'topbar.language' | t }}</span>
      <select
        class="locale-select"
        [ngModel]="i18n.locale()"
        (ngModelChange)="setUiLocale($event)"
      >
        <option ngValue="tr">{{ 'topbar.locale.tr' | t }}</option>
        <option ngValue="en">{{ 'topbar.locale.en' | t }}</option>
      </select>
    </label>
    @if (showDevRole) {
      <label class="topbar__dev" [attr.title]="'dev.roleHint' | t">
        <span class="topbar__dev-label">{{ 'dev.roleLabel' | t }}</span>
        <select
          class="dev-select"
          [ngModel]="auth.user().role"
          (ngModelChange)="onRoleChange($event)"
        >
          @for (r of roles; track r) {
            <option [ngValue]="r">{{ 'role.' + r | t }}</option>
          }
        </select>
      </label>
    }
    <button type="button" class="icon-btn icon-btn--badge" [attr.aria-label]="'topbar.notifications' | t">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" />
      </svg>
      <span class="badge-dot"></span>
    </button>
    <div class="profile" [class.profile--open]="profileOpen()">
      <button
        type="button"
        class="profile__trigger"
        (click)="toggleProfile()"
        [attr.aria-expanded]="profileOpen()"
        aria-haspopup="true"
      >
        <span class="profile__avatar">{{ auth.user().avatarInitials ?? '?' }}</span>
        <span class="profile__meta">
          <span class="profile__name">{{ auth.user().displayName }}</span>
          <span class="profile__role">{{ 'role.' + auth.user().role | t }}</span>
        </span>
        <svg
          class="profile__chev"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>
      @if (profileOpen()) {
        <div class="profile__dropdown" role="menu">
          <button type="button" role="menuitem">{{ 'profile.myProfile' | t }}</button>
          <button type="button" role="menuitem">{{ 'profile.accountSettings' | t }}</button>
          <button type="button" role="menuitem" (click)="signOut()">{{ 'profile.signOut' | t }}</button>
        </div>
      }
    </div>
  </div>
</header>
